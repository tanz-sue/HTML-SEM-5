<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Largest Element Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Find Second Largest</h2>
    <div class="input-group">
        <label for="arrayInput">Enter numbers (comma-separated):</label>
        <input type="text" id="arrayInput" placeholder="e.g. 12, 35, 1, 10, 34, 1">
    </div>
    <button onclick="calculateSecondLargest()">Find Second Largest</button>
    <div id="resultBox" class="result"></div>
</div>

<script src="script.js"></script>

</body>
</html>
